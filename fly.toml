# Fly app (created via Fly Launch). Secrets: DATABASE_URL, DATABASE_URL_UNPOOLED (see README).
app = "uplane-klaus-game"
# Best: the region closest to your Neon database (e.g. fra ↔ aws-eu-central-1).
primary_region = "sjc"

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "8080"
  STALE_AFTER_SECONDS = "900"

[http_service]
  internal_port = 8080
  force_https = true
  # TVs keep a stream open all day: keep a machine running.
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [http_service.concurrency]
    type = "connections"
    soft_limit = 500
    hard_limit = 1000

  [[http_service.checks]]
    grace_period = "15s"
    interval = "15s"
    method = "GET"
    path = "/health"
    timeout = "5s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
